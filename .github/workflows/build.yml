name: Собрать APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Распаковать архив, если он есть
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -gt 0 ]; then
            unzip -o -q "${zips[0]}" -d /tmp/unz
            src=$(dirname "$(find /tmp/unz -name settings.gradle.kts | head -n1)")
            rm -rf "$src/.github"
            cp -r "$src/." .
            rm -f *.zip
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add -A
            git commit -m "Распаковал проект из архива"
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Сборка
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: aurora-player-apk
          path: app/build/outputs/apk/debug/*.apk
