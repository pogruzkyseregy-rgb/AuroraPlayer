<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>fluorite_blue</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ===== Цвета приложения: меняй здесь ===== */
:root{
  --bg:#1a1433; --surface:#241c45; --line:#352a5e; --text:#f3e6ff; --muted:#b4a3d6;
  --fox:#ff9a5c; --rose:#ff7a8a; --onfox:#1a1433; --row:#2c2352;
  --display:"Unbounded","Manrope",system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0; background:transparent; color:var(--text)}
/* фон с лапками: лежит под всем интерфейсом */
body::before{content:""; position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:.42;
  background:url(bg.png) center 30%/auto 105% no-repeat}
body{font-family:"Manrope",system-ui,Roboto,sans-serif; font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; user-select:none}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer}
.wrap{max-width:520px; margin:0 auto; padding:16px 16px 40px}

/* --- шапка с Авророй --- */
header{display:flex; align-items:center; gap:12px}
.ava{width:56px; height:56px; flex:none; border-radius:50%;
  background:#2c2352 url(aurora.jpg) 46.7% 8.5%/250% auto no-repeat;
  box-shadow:0 0 0 3px var(--bg), 0 0 6px 0 rgba(255,122,138,.25); will-change:transform}
h1{flex:1; font-family:var(--display); font-weight:700; font-size:26px; letter-spacing:-0.02em; margin:0; line-height:1.1;
  background:linear-gradient(90deg,var(--fox),var(--rose)); -webkit-background-clip:text; background-clip:text; color:transparent}
.tb{width:44px; height:44px; border-radius:50%; display:grid; place-items:center; color:var(--muted); position:relative; flex:none}
.tb svg{width:22px; height:22px}
.tb.on{color:var(--fox)}
.badge{position:absolute; top:3px; right:0; min-width:18px; height:18px; border-radius:9px; padding:0 4px;
  background:var(--fox); color:var(--onfox); font-size:11px; font-weight:700; display:grid; place-items:center; line-height:1}
.say{position:relative; margin:12px 0 14px; padding:10px 14px; background:rgba(36,28,69,.86); border-radius:6px 18px 18px 18px;
  color:var(--muted); font-size:15px; min-height:44px; transition:opacity .3s}
.say::before{content:""; position:absolute; top:-7px; left:22px; border:7px solid transparent; border-top:0; border-bottom-color:rgba(36,28,69,.86)}
.say b{color:var(--text); font-weight:600}

/* --- небо и плеер --- */
.sky{position:relative; width:100%; aspect-ratio:16/11; border-radius:28px; overflow:hidden; background:#120d2a;
  box-shadow:0 18px 40px -22px rgba(0,0,0,.7)}
.sky canvas{display:block; width:100%; height:100%}
.now{display:flex; gap:14px; align-items:center; margin:18px 0 10px}
.cover{width:58px; height:58px; flex:none; border-radius:16px; overflow:hidden;
  background:linear-gradient(160deg,var(--fox),var(--rose)); display:grid; place-items:center}
.cover img{width:100%; height:100%; object-fit:cover; display:block}
.cover svg{width:34px; height:34px}
.meta{min-width:0; flex:1}
.title{font-family:var(--display); font-weight:500; font-size:17px; line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.artist{color:var(--muted); font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.seek{display:flex; align-items:center; gap:10px; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none; appearance:none; width:100%; height:30px; background:transparent; margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px; border-radius:6px;
  background:linear-gradient(90deg,var(--fox) 0 var(--p,0%),var(--line) var(--p,0%) 100%)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:20px; height:20px; border-radius:50%;
  background:var(--fox); margin-top:-7px; border:3px solid var(--surface)}
.controls{display:flex; justify-content:space-between; align-items:center; margin:8px 4px 24px}
.ib{width:48px; height:48px; border-radius:50%; display:grid; place-items:center; color:var(--muted); position:relative}
.ib svg{width:24px; height:24px}
.ib.main{color:var(--text)}
.ib.on{color:var(--fox)}
.ib .one{position:absolute; font-size:10px; font-weight:700; top:9px; right:8px; color:var(--fox)}
.play{width:72px; height:72px; border-radius:50%; display:grid; place-items:center;
  background:linear-gradient(150deg,var(--fox),var(--rose)); color:var(--onfox); box-shadow:0 10px 24px -10px var(--rose)}
.play svg{width:30px; height:30px}
.play:active,.ib:active,.tb:active{transform:scale(.94)}

/* --- вкладки, поиск, списки --- */
.tabs{display:flex; gap:8px; margin-bottom:12px; overflow-x:auto; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none; padding:9px 16px; border-radius:999px; background:var(--surface); border:1px solid var(--line); color:var(--muted); font-weight:700; font-size:14px}
.tab.on{background:linear-gradient(150deg,var(--fox),var(--rose)); color:var(--onfox); border-color:transparent}
.tab span{opacity:.75; font-weight:600; margin-left:4px}
.bar{display:flex; gap:6px; align-items:center; margin-bottom:10px}
.search{flex:1; display:flex; align-items:center; gap:8px; height:44px; padding:0 14px; border-radius:999px;
  background:var(--surface); border:1px solid var(--line); color:var(--muted)}
.search svg{width:18px; height:18px; flex:none}
.search input{flex:1; min-width:0; background:none; border:0; outline:none; color:var(--text); font:inherit; font-size:15px; user-select:text}
.plname{flex:1; min-width:0; font-family:var(--display); font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
ol{list-style:none; margin:0; padding:0; border-radius:20px; overflow:hidden; background:rgba(36,28,69,.84); border:1px solid var(--line)}
li{display:flex; align-items:center; border-top:1px solid var(--line)}
li:first-child{border-top:0}
li.cur{background:var(--row)}
li.drag{position:relative; z-index:3; background:var(--row); box-shadow:0 12px 28px -8px rgba(0,0,0,.7)}
li.shift{transition:transform .15s}
.pick{flex:1; min-width:0; text-align:left; padding:10px 6px 10px 12px; display:flex; gap:12px; align-items:center}
.pick .t{min-width:0}
.pick .t div{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.pick .t .a{color:var(--muted); font-size:13px}
li.cur .pick .t div:first-child{color:var(--fox); font-weight:700}
.th{position:relative; width:44px; height:44px; flex:none; border-radius:12px; overflow:hidden;
  background:linear-gradient(160deg,var(--fox),var(--rose)); display:grid; place-items:center}
.th img{width:100%; height:100%; object-fit:cover; display:block}
.th svg{width:24px; height:24px}
.th.pl{background:var(--row); color:var(--fox)}
.eqi{position:absolute; inset:0; background:rgba(26,20,51,.55); display:flex; align-items:flex-end; justify-content:center; gap:3px; padding-bottom:12px}
.eqi i{width:4px; height:6px; border-radius:2px; background:var(--fox); animation:eqb .8s ease-in-out infinite alternate}
.eqi i:nth-child(2){animation-delay:-.3s} .eqi i:nth-child(3){animation-delay:-.55s}
@keyframes eqb{from{height:4px} to{height:20px}}
.rb{width:44px; height:44px; flex:none; color:var(--muted); display:grid; place-items:center; margin-right:4px}
.rb svg{width:20px; height:20px}
.grip{width:36px; align-self:stretch; flex:none; display:grid; place-items:center; color:var(--muted); touch-action:none; margin-left:4px}
.grip svg{width:20px; height:20px}
.chev{color:var(--muted); font-size:24px; padding:0 16px}
.empty{padding:26px 20px; text-align:center; color:var(--muted); background:rgba(36,28,69,.84); border:1.5px dashed var(--line); border-radius:20px}
.empty .btn{margin-top:14px}
.newpl{width:100%; display:flex; align-items:center; justify-content:center; gap:8px; padding:14px; margin-bottom:10px;
  border-radius:18px; border:1.5px dashed var(--line); color:var(--fox); font-weight:700}
.newpl svg{width:18px; height:18px}

/* --- рекомендации --- */
.sec{margin:22px 0 10px; display:flex; align-items:center; gap:10px}
.sec:first-child{margin-top:4px}
.sec h3{flex:1; margin:0; font-family:var(--display); font-weight:500; font-size:16px}
.sec .tb{color:var(--fox)}
.note{margin:-4px 0 10px; color:var(--muted); font-size:14px}

/* --- меню трека --- */
.tm{display:flex; gap:14px; align-items:center; margin-bottom:16px}
.tm .th{width:64px; height:64px; border-radius:16px}
.tm .th svg{width:34px; height:34px}
.tm h3{margin:0}
.tm .muted{margin:2px 0 0}
.field+.field{margin-top:10px}

/* --- скромная подпись внизу --- */
.sig{display:flex; align-items:center; gap:12px; margin:40px 4px 0; opacity:.38}
.sig img{width:34px; height:auto; flex:none}
.sig div{display:flex; flex-direction:column; font:11px/1.6 ui-monospace,"JetBrains Mono","Roboto Mono",monospace; color:var(--muted)}
.sig .cur{font-style:normal; animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* --- лайки --- */
.lk{width:40px; height:40px; flex:none; display:grid; place-items:center}
.lk img{width:30px; height:30px; border-radius:8px; display:block; transition:transform .15s, filter .2s}
.lk.on img{filter:drop-shadow(0 0 6px rgba(255,140,120,.75))}
.lk:active img{transform:scale(.85)}
.lk.pop img{animation:pop .4s ease}
@keyframes pop{45%{transform:scale(1.35)}}
.now .lk{width:52px; height:52px}
.now .lk img{width:42px; height:42px; border-radius:11px}
.now .rb{margin-right:-6px}
.now .rb svg{width:24px; height:24px}
.th.liked{background:none}
.th.liked img{border-radius:12px}

/* --- радио --- */
.tabic{width:20px; height:20px; border-radius:50%; object-fit:cover; vertical-align:-5px; margin-right:6px}
.rhero{position:relative; aspect-ratio:16/7; border-radius:20px; overflow:hidden; margin-bottom:12px; background:#120a22}
.rhero img{width:100%; height:100%; object-fit:cover; object-position:50% 30%; display:block}
.rhero div{position:absolute; left:0; right:0; bottom:0; padding:14px 16px; display:flex; flex-direction:column;
  background:linear-gradient(0deg,rgba(10,6,20,.92),rgba(10,6,20,0))}
.rhero b{font-family:var(--display); font-weight:500; font-size:18px}
.rhero span{font-size:13px; color:var(--muted)}
.rchips{display:flex; gap:8px; overflow-x:auto; margin-bottom:12px; scrollbar-width:none}
.rchips::-webkit-scrollbar{display:none}
.rchips .chip{flex:none; padding:8px 12px}
.sec2{margin:16px 4px 8px; color:var(--muted); font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase}
.rb.fav{color:var(--fox)}

/* --- оформление --- */
.themes{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:6px}
.thc{text-align:left}
.thc i{display:grid; place-items:center; aspect-ratio:16/11; border-radius:14px; border:2px solid transparent;
  background-color:#120a22; background-size:cover; background-position:center; color:var(--muted)}
.thc i svg{width:26px; height:26px}
.thc.none i{border:1.5px dashed var(--line)}
.thc.on i{border-color:var(--fox)}
.thc span{display:block; margin-top:6px; font-size:14px; font-weight:600}
.thc.on span{color:var(--fox)}
.sw{display:inline-block; width:14px; height:14px; border-radius:50%; margin-right:6px; vertical-align:-2px}
.eqc i{background-image:repeating-linear-gradient(90deg,var(--fox) 0 5px,transparent 5px 11px),linear-gradient(#1c1338,#1c1338)}
.themes+.themes{margin-top:2px}

/* --- нижние окна --- */
.scrim{position:fixed; inset:0; z-index:20; background:rgba(10,6,24,.6); opacity:0; pointer-events:none; transition:opacity .2s}
.scrim.show{opacity:1; pointer-events:auto}
.sheet{position:fixed; left:0; right:0; bottom:0; z-index:21; max-width:520px; margin:0 auto; max-height:84vh; overflow:auto;
  background:var(--surface); border-radius:24px 24px 0 0; padding:10px 18px 26px; transform:translateY(105%); transition:transform .25s ease}
.sheet.show{transform:none}
.grab{width:40px; height:4px; border-radius:2px; background:var(--line); margin:0 auto 14px}
.sheet h3{font-family:var(--display); font-weight:500; font-size:17px; margin:0 0 6px}
.muted{color:var(--muted); font-size:14px; margin:0 0 14px}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px}
.grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:10px}
.chip{padding:10px 12px; border-radius:14px; background:var(--row); border:1px solid var(--line); font-weight:600; font-size:14px}
.chip.on{border-color:var(--fox); color:var(--fox)}
.chip.wide{grid-column:1/-1}
.btn{height:46px; padding:0 18px; border-radius:14px; background:linear-gradient(150deg,var(--fox),var(--rose)); color:var(--onfox); font-weight:700}
.btn.ghost{background:var(--row); color:var(--text); border:1px solid var(--line)}
.btn.full{width:100%; margin-top:8px}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px}
.field{width:100%; height:48px; padding:0 14px; border-radius:14px; border:1px solid var(--line); background:var(--bg);
  color:var(--text); font:inherit; outline:none; user-select:text}
.field:focus{border-color:var(--fox)}
.opts{display:flex; flex-direction:column; gap:8px}
.opt{text-align:left; padding:14px 16px; border-radius:14px; background:var(--row); font-weight:600}
.opt .muted{margin:0; font-weight:400}
.opt.accent{color:var(--fox)}
.opt.danger{color:var(--rose)}
.linkrow{display:block; width:100%; margin-top:12px; padding:12px; text-align:center; color:var(--muted); font-size:14px}
.linkrow u{color:var(--fox); text-underline-offset:3px}
.band{display:grid; grid-template-columns:62px 1fr 54px; align-items:center; gap:10px; margin-bottom:4px; font-size:13px; color:var(--muted)}
.band .v{text-align:right; font-variant-numeric:tabular-nums}

/* --- арт на весь экран --- */
.idle{position:fixed; inset:0; z-index:40; display:flex; align-items:center; justify-content:center; text-align:center; padding:20px;
  background:linear-gradient(165deg,#0a0620,#150a30 55%,#0b0522); opacity:0; pointer-events:none; transition:opacity 1.6s ease}
.idle.on{opacity:1; pointer-events:auto}
.idle p{margin:0; font-family:ui-monospace,"Roboto Mono",monospace; font-size:13px; line-height:1.8; letter-spacing:.02em; color:rgba(196,186,230,.55)}
.idle .cur2{display:inline-block; width:7px; height:1em; background:currentColor; margin-left:3px; vertical-align:-2px; animation:blink2 1.1s steps(1) infinite}
@keyframes blink2{50%{opacity:0}}
.art{position:fixed; inset:0; z-index:30; background:rgba(10,6,24,.94); display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:16px; padding:20px; opacity:0; pointer-events:none; transition:opacity .25s}
.art.show{opacity:1; pointer-events:auto}
.art img{max-width:100%; max-height:78vh; border-radius:22px; object-fit:contain}
.art p{margin:0; text-align:center; font-size:16px}
</style>
</head>
<body>
<div class="idle" id="idleScreen"><p>&gt; система запущена<br>&gt; жду указаний<span class="cur2"></span></p></div>
<div class="wrap">
  <header>
    <button class="ava" id="ava" aria-label="Посмотреть на Аврору"></button>
    <h1>Аврора</h1>
    <button class="tb" id="bTheme" aria-label="Оформление">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18c1 0 1.6-.8 1.6-1.6 0-.4-.2-.8-.4-1.1a1.6 1.6 0 0 1 1.2-2.7H16a5 5 0 0 0 5-5C21 6.4 17 3 12 3z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7" r="1"/><circle cx="14.5" cy="7" r="1"/></svg>
    </button>
    <button class="tb" id="bSleep" aria-label="Таймер сна">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
      <span class="badge" id="sleepBadge" hidden></span>
    </button>
    <button class="tb" id="bEq" aria-label="Эквалайзер">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 21v-6M4 11V3M12 21v-9M12 8V3M20 21v-4M20 13V3M1 15h6M9 8h6M17 17h6"/></svg>
    </button>
  </header>
  <p class="say" id="say">Просыпаюсь…</p>

  <div class="sky"><canvas id="sky"></canvas></div>

  <div class="now">
    <div class="cover" id="cover"></div>
    <div class="meta">
      <div class="title" id="title">Ничего не играет</div>
      <div class="artist" id="artist">Выбери трек из списка</div>
    </div>
    <button class="lk" id="nowLike" aria-label="Нравится" hidden><img alt="" src="like-off.webp"></button>
    <button class="rb" id="nowMenu" aria-label="Действия с треком" hidden></button>
  </div>

  <div class="seek">
    <span id="cur">0:00</span>
    <input type="range" id="pos" min="0" max="1000" value="0" aria-label="Позиция в треке">
    <span id="dur">0:00</span>
  </div>

  <div class="controls">
    <button class="ib" id="shuffle" aria-label="Перемешать">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="M4 4l5 5"/></svg>
    </button>
    <button class="ib main" id="prev" aria-label="Предыдущий трек">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
    </button>
    <button class="play" id="play" aria-label="Играть">
      <svg id="icoPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <svg id="icoPause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>
    <button class="ib main" id="next" aria-label="Следующий трек">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
    </button>
    <button class="ib" id="repeat" aria-label="Повтор">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
      <span class="one" id="one" hidden>1</span>
    </button>
  </div>

  <nav class="tabs">
    <button class="tab on" id="tabLib">Треки<span id="libN"></span></button>
    <button class="tab" id="tabLists">Плейлисты</button>
    <button class="tab" id="tabRecs">Для тебя</button>
    <button class="tab" id="tabRadio"><img class="tabic" src="radio.jpg" alt="">Радио</button>
  </nav>

  <div class="bar" id="libBar" hidden>
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="text" placeholder="Поиск по трекам" autocomplete="off">
    </label>
    <button class="tb" id="bRescan" aria-label="Найти музыку заново">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
    </button>
  </div>

  <div class="bar" id="radioBar" hidden>
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="rq" type="text" placeholder="Название станции" autocomplete="off" enterkeyhint="search">
    </label>
  </div>

  <div class="bar" id="plBar" hidden>
    <button class="tb" id="plBack" aria-label="К плейлистам">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="plname" id="plName"></div>
    <button class="tb" id="plPlay" aria-label="Играть плейлист" style="color:var(--fox)">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>

/* ===== Оформление: фон и эквалайзер выбираются отдельно и сочетаются =====
   Новый фон: добавь в BGS и функцию drawBg<Имя>. Новый эквалайзер: добавь в EQS и функцию eq<Имя>. */
const BGS=[['dawn','Рассвет'],['sil','Силуэт'],['car','Ночной дрифт'],['custom','Своё фото']];
const EQS=[['classic','Классика'],['wave','Волна'],['hud','HUD']];
const PALETTES={neon:['Неон','#ff3b6b','#b84dff'],fluorite:['Флюорит','#5ae6f5','#8e9bff'],dawn:['Закат','#ffc070','#ff6f91']};
const store={get(k,d){ try{ return localStorage.getItem(k)||d; }catch(e){ return d; } },

let bg=store.get('theme','dawn'), eqStyle=store.get('eq','classic'), palette=store.get('palette','neon'), bgName=store.get('bg','');

const RU_PRESETS={Normal:"Обычный",Classical:"Классика",Dance:"Танцы",Flat:"Ровный",Folk:"Фолк",

/* ===== Помощники ===== */
const pick=a=>a[Math.floor(Math.random()*a.length)];
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=ms=>{ let s=Math.floor((ms||0)/1000); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
function plural(n,a,b,c){ const m=n%100, k=n%10; if(m>=11&&m<=14) return c; if(k===1) return a; if(k>=2&&k<=4) return b; return c; }
function speak(html){ const el=$('say'); el.style.opacity=0; setTimeout(()=>{el.innerHTML=html; el.style.opacity=1},160); }

const card=(html)=>'<div class="empty">'+html+'</div>';
const FOX='<svg viewBox="0 0 24 24" fill="#fff"><path d="M3 20 6 4l6 7 6-7 3 16z" opacity=".95"/></svg>';
const PLUS='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';

/* ===== Лайки: плейлист «Нравится» (id liked) ===== */
const LIKED='liked';

  speak(on?pick(lines.liked):lines.unliked);

/* ===== Данные от Android ===== */
let lib=[], libMap={}, pls=[], perm=null, scanning=false, libLoaded=false, recSecs={}, hiddenN=0;
let st={playing:false,moving:false,ended:false,currentId:'',title:'',artist:'',pos:0,dur:0,shuffle:false,repeat:'off',source:'',sleep:0};
let stAt=performance.now(), seeking=false, shownId=null;
let tab='lib', openPl=null, query='';
const curPos=()=>Math.min(st.dur||0, st.pos+(st.moving?performance.now()-stAt:0));

window.fromAndroid={
  library(list,granted,isScanning,hidden){
    const wasScanning=scanning; hiddenN=hidden||0;
    lib=list; libMap={}; list.forEach(t=>libMap[t.id]=t); perm=granted; scanning=isScanning;
    $('libN').textContent=list.length?list.length:'';

  },
  playlists(list){ pls=list; renderList(); paintLike($('nowLike'),isLiked(st.currentId),false); },
  saved(kind){ speak(kind==='fail'?lines.coverFail:lines.coverOk); },
  deleted(ok){ speak(ok?lines.deleted:lines.delFail); },
  radio(list){ radio.loading=false; radio.failed=list===null; radio.list=list||[]; if(radio.failed) speak(lines.radioFail); if(tab==='radio') renderList(); },

    setBg('custom'); if(sheetOpen&&sheet.dataset.kind==='theme') openTheme();

  state(s){
    const was=st; st=s; stAt=performance.now();

    const radioNow=(s.currentId||'').startsWith('radio:');
    if(s.err&&!was.err) speak(radioNow?lines.radioErr:'Не получается включить этот трек.');
    else if(was.sleep&&!s.sleep&&was.playing&&!s.playing) speak(lines.sleepDone);
    else if(s.playing&&(!was.playing||s.currentId!==was.currentId)) speak(pick(radioNow?lines.radioOn:lines.play));
    else if(s.ended&&!was.ended) speak(lines.end);
    else if(!s.playing&&was.playing&&!s.ended&&s.currentId) speak(pick(lines.pause));

    $('bSleep').classList.toggle('on',!!s.sleep);
    if(was.currentId!==s.currentId||was.playing!==s.playing||was.title!==s.title){ updateNow(); if(!(tab==='radio'&&was.currentId===s.currentId&&was.playing===s.playing)) renderList(); }
  },
  back(){

    if(sheetOpen){ closeSheet(); return true; }
    if(tab==='lists'&&openPl){ openPl=null; renderList(); return true; }

    if(tab==='radio'&&radio.q){ $('rq').value=''; radio.q=''; radioLoad(); return true; }
    return false;
  }

/* ===== Что сейчас играет ===== */
function updateNow(){
  const t=libMap[st.currentId];
  if((st.currentId||'').startsWith('radio:')){
    const name=st.station||st.title, song=st.title&&st.title!==name?st.title:'';
    $('title').textContent=song||name; $('artist').textContent=song?'📻 '+name:'📻 Радио в эфире';
    $('nowLike').hidden=$('nowMenu').hidden=true;
    if(shownId!==st.currentId){ shownId=st.currentId; $('cover').innerHTML='<img alt="" src="radio.jpg">'; }
    return;
  }
  const title=(t&&t.title)||st.title;
  $('title').textContent=title||'Ничего не играет';
  $('artist').textContent=title?((t&&t.artist)||st.artist||''):'Выбери трек из списка';
  $('nowLike').hidden=$('nowMenu').hidden=!(t&&st.currentId);
  if(t) paintLike($('nowLike'),isLiked(st.currentId),false);
  const key=st.currentId+'|'+(t?t.av:0);
  if(shownId!==key){
    shownId=key;
    $('cover').innerHTML=st.currentId?'<img alt="" src="'+artUrl(st.currentId)+'" onerror="noArt(this)">':FOX;
  }
}

/* ===== Списки ===== */
function visible(){
  if(!query) return lib;
  const q=query.toLowerCase();
  return lib.filter(t=>(t.title+' '+t.artist+' '+t.album).toLowerCase().includes(q));

function row(t,i,mode,sec,sub){

  return '<li class="'+(cur?'cur':'')+'">'+
    (mode==='pl'?'<span class="grip">'+GRIP+'</span>':'')+

/* ===== Рекомендации Авроры =====
   Считаются прямо здесь из статистики прослушиваний (Stats в Library.kt).
   Хочешь новую подборку: добавь ещё один блок в secs. */
function seeded(list,seed){
  const a=list.slice(); let x=seed%2147483647||1;
  for(let i=a.length-1;i>0;i--){ x=x*16807%2147483647; const j=x%(i+1); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function recsHtml(){
  if(perm!==true||!lib.length) return card('Сначала мне нужна твоя музыка. Загляни во вкладку «Треки».');
  let S={}; try{ S=JSON.parse(call('stats')||'{}'); }catch(e){}
  const now=Date.now(), DAY=864e5, times=n=>n+' '+plural(n,'раз','раза','раз');
  const played=lib.filter(t=>S[t.id]&&S[t.id].c);
  const secs=[];
  const top=played.slice().sort((a,b)=>S[b.id].c-S[a.id].c).slice(0,15);
  if(top.length) secs.push({key:'top',title:'Твой топ',note:'То, что ты слушаешь чаще всего.',list:top,sub:t=>times(S[t.id].c)});
  const wk=played.map(t=>({t,n:(S[t.id].w||[]).filter(x=>now-x<7*DAY).length})).filter(x=>x.n>=2).sort((a,b)=>b.n-a.n).slice(0,10);
  if(wk.length) secs.push({key:'week',title:'На повторе этой недели',note:'Эти треки не отпускают тебя последние дни.',list:wk.map(x=>x.t),sub:t=>times(wk.find(x=>x.t===t).n)+' за неделю'});
  const old=played.filter(t=>S[t.id].c>=2&&now-S[t.id].l>21*DAY).sort((a,b)=>S[b.id].c-S[a.id].c).slice(0,10);
  if(old.length) secs.push({key:'old',title:'Давно не слушал',note:'Раньше ты крутил их часто. Соскучился?',list:old,sub:t=>Math.floor((now-S[t.id].l)/DAY)+' дн. назад'});
  const fresh=seeded(lib.filter(t=>!S[t.id]),Math.floor(now/DAY)).slice(0,10);
  if(fresh.length) secs.push({key:'new',title:'Ещё не слушал',note:'Лежат на телефоне, а ты их ни разу не включал. Рискнём?',list:fresh});
  recSecs={}; secs.forEach(x=>recSecs[x.key]=x);
  let h=played.length?'':card(lines.recsEmpty+'<br>Трек засчитывается, когда дослушан до середины.');
  secs.forEach(x=>{
    h+='<div class="sec"><h3>'+x.title+'</h3><button class="tb" data-recplay="'+x.key+'" aria-label="Играть подборку">'+
      '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button></div>'+
      '<p class="note">'+x.note+'</p><ol>'+x.list.map((t,i)=>row(t,i,'rec',x.key,x.sub&&x.sub(t))).join('')+'</ol>';
  });
  return h;
}

const GENRES=[['','Популярное'],['pop','Поп'],['rock','Рок'],['electronic','Электроника'],['chillout','Chill'],
  ['lofi','Lo-Fi'],['jazz','Джаз'],['hip hop','Хип-хоп'],['classical','Классика'],['anime','Аниме']];
const STAR=f=>'<svg viewBox="0 0 24 24" fill="'+(f?'currentColor':'none')+'" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8L3.5 9.2l5.9-.9z"/></svg>';
const radio={list:null,loading:false,failed:false,q:'',tag:'',world:false,favs:[]};
try{ radio.favs=JSON.parse(store.get('radioFavs','[]')); }catch(e){}
const isFav=id=>radio.favs.some(x=>x.id===id);
function radioLoad(){
  if(!A){ radio.list=[]; return renderList(); }
  const p=[]; if(!radio.world) p.push('countrycode=RU');
  if(radio.q) p.push('name='+encodeURIComponent(radio.q));
  if(radio.tag) p.push('tag='+encodeURIComponent(radio.tag));
  radio.loading=true; renderList(); call('radioSearch',p.join('&')||'limit=60');
}
function stationRow(s,i,src){
  const cur=st.currentId==='radio:'+s.id, f=isFav(s.id);
  const meta=[s.country,(s.tags||'').split(',').filter(Boolean).slice(0,2).join(', '),s.br?s.br+' kbps':''].filter(Boolean).join(' · ');
  return '<li class="'+(cur?'cur':'')+'"><button class="pick" data-rplay="'+i+'" data-rsrc="'+src+'"><span class="th">'+
    '<img loading="lazy" alt="" src="'+esc(s.fav||'radio.jpg')+'" onerror="this.onerror=null;this.src=\'radio.jpg\'">'+
    (cur&&st.playing?'<span class="eqi"><i></i><i></i><i></i></span>':'')+
    '</span><span class="t"><div>'+esc(s.name)+'</div><div class="a">'+esc(meta||'радио')+'</div></span></button>'+
    '<button class="rb'+(f?' fav':'')+'" data-rfav="'+i+'" data-rsrc="'+src+'" aria-label="Избранное">'+STAR(f)+'</button></li>';
}
function radioHtml(){
  if(radio.list===null&&!radio.loading) setTimeout(radioLoad,0);
  let h='<div class="rhero"><img src="radio.jpg" alt=""><div><b>Радио Авроры</b><span>Тысячи станций со всего мира. Темы и эквалайзер работают и тут.</span></div></div>';
  h+='<div class="rchips"><button class="chip on" data-world="1">'+(radio.world?'🌍 Весь мир':'🇷🇺 Россия')+'</button>'+
    GENRES.map(([k,n])=>'<button class="chip'+(radio.tag===k?' on':'')+'" data-genre="'+esc(k)+'">'+n+'</button>').join('')+'</div>';
  if(radio.favs.length&&!radio.q) h+='<div class="sec2">Избранное</div><ol>'+radio.favs.map((s,i)=>stationRow(s,i,'fav')).join('')+'</ol>';
  if(radio.loading) return h+card('Настраиваю приёмник…');
  if(radio.failed) return h+card(lines.radioFail+'<br><button class="btn" id="rRetry">Ещё раз</button>');
  if(!radio.list||!radio.list.length) return h+card('Станций не нашлось. Попробуй другое название или жанр.');
  return h+'<div class="sec2">'+(radio.q?'Найдено':'Станции')+'</div><ol>'+radio.list.map((s,i)=>stationRow(s,i,'res')).join('')+'</ol>';
}

function renderList(){
  if(drag) return;
  const p=openPl&&pls.find(x=>x.id===openPl);
  if(openPl&&!p&&pls.length) openPl=null;
  $('tabLib').classList.toggle('on',tab==='lib'); $('tabLists').classList.toggle('on',tab==='lists'); $('tabRecs').classList.toggle('on',tab==='recs');
  $('tabRadio').classList.toggle('on',tab==='radio'); $('radioBar').hidden=tab!=='radio';
  $('libBar').hidden=!(tab==='lib'&&perm===true&&(lib.length||hiddenN));
  $('plBar').hidden=!(tab==='lists'&&p);
  $('plEdit').hidden=$('plDel').hidden=!!(p&&p.id===LIKED);
  $('list').innerHTML= tab==='lib'?libHtml() : tab==='recs'?recsHtml() : tab==='radio'?radioHtml() : p?plHtml(p) : openPl?card('…') : listsHtml();
}

$('list').addEventListener('click',e=>{
  const el=e.target.closest('[data-like],[data-play],[data-menu],[data-rm],[data-open],[data-recplay],[data-rplay],[data-rfav],[data-world],[data-genre],#askPerm,#newPl,#unhide,#rRetry');
  if(!el) return;
  if(el.dataset.like) return toggleLike(el.dataset.like);
  if(el.id==='unhide'){ call('unhideAll'); speak(lines.unhid); return; }
  if(el.id==='rRetry') return radioLoad();
  if(el.dataset.world){ radio.world=!radio.world; return radioLoad(); }
  if(el.dataset.genre!==undefined){ radio.tag=el.dataset.genre; return radioLoad(); }
  if(el.dataset.rplay!==undefined||el.dataset.rfav!==undefined){
    const src=el.dataset.rsrc==='fav'?radio.favs:(radio.list||[]);
    const i=+(el.dataset.rplay!==undefined?el.dataset.rplay:el.dataset.rfav), s=src[i]; if(!s) return;
    if(el.dataset.rfav!==undefined){
      if(isFav(s.id)){ radio.favs=radio.favs.filter(x=>x.id!==s.id); speak(lines.radioUnfav); }
      else { radio.favs.unshift(s); speak(lines.radioFav); }
      store.set('radioFavs',JSON.stringify(radio.favs)); return renderList();
    }
    if(st.currentId==='radio:'+s.id) return call('toggle');
    return call('radioPlay',JSON.stringify(src.map(x=>({id:x.id,name:x.name,url:x.url}))),i);
  }
  if(el.id==='askPerm') return call('askPermission');
  if(el.id==='newPl') return openName('Новый плейлист','',n=>{ openPl=call('newPlaylist',n); speak(lines.plNew(esc(n))); renderList(); });
  if(el.dataset.open) { openPl=el.dataset.open; window.scrollTo({top:$('list').offsetTop-80,behavior:'smooth'}); return renderList(); }
  if(el.dataset.menu) return openTrackMenu(el.dataset.menu);
  if(el.dataset.recplay){
    const x=recSecs[el.dataset.recplay]; if(!x) return;
    return call('playList',JSON.stringify(x.list.map(t=>t.id)),0,'rec:'+x.key);
  }
  if(el.dataset.sec){
    const x=recSecs[el.dataset.sec], i=+el.dataset.play, t=x&&x.list[i]; if(!t) return;
    if(t.id===st.currentId) return call('toggle');
    return call('playList',JSON.stringify(x.list.map(t=>t.id)),i,'rec:'+x.key);
  }
  if(el.dataset.rm!==undefined){
    const p=pls.find(x=>x.id===openPl); const i=+el.dataset.rm;
    if(p){ p.ids.splice(i,1); call('removeFromPlaylist',p.id,i); renderList(); }
    return;
  }
  // запуск трека
  const i=+el.dataset.play;
  if(tab==='lib'){
    const v=visible(), t=v[i]; if(!t) return;
    if(t.id===st.currentId) return call('toggle');
    call('playList',JSON.stringify(v.map(x=>x.id)),i,query?'search:'+query:'lib');
  } else {
    const p=pls.find(x=>x.id===openPl); if(!p) return;
    const id=p.ids[i]; if(id===st.currentId&&st.source==='pl:'+p.id) return call('toggle');
    const ids=p.ids.filter(x=>libMap[x]);
    call('playList',JSON.stringify(ids),ids.indexOf(id),'pl:'+p.id);
  }
});

/* ===== Перетаскивание треков в плейлисте ===== */
let drag=null;
$('list').addEventListener('pointerdown',e=>{
  const g=e.target.closest('.grip'); if(!g) return;
  e.preventDefault();
  const li=g.closest('li'), rows=[...li.parentNode.children], from=rows.indexOf(li);
  drag={li,rows,from,to:from,y0:e.clientY,y:e.clientY,h:li.getBoundingClientRect().height,scroll:0};
  li.classList.add('drag'); rows.forEach(r=>{ if(r!==li) r.classList.add('shift'); });
  g.setPointerCapture(e.pointerId);
  requestAnimationFrame(dragScroll);
});
$('list').addEventListener('pointermove',e=>{ if(drag){ drag.y=e.clientY; dragUpdate(); } });
function dragUpdate(){
  const dy=drag.y-drag.y0+drag.scroll;
  drag.li.style.transform='translateY('+dy+'px)';
  const to=Math.max(0,Math.min(drag.rows.length-1,drag.from+Math.round(dy/drag.h)));
  drag.to=to;
  drag.rows.forEach((r,i)=>{
    if(r===drag.li) return;
    let s=0;
    if(drag.from<to&&i>drag.from&&i<=to) s=-drag.h;
    else if(drag.from>to&&i<drag.from&&i>=to) s=drag.h;
    r.style.transform=s?'translateY('+s+'px)':'';
  });
}
function dragScroll(){
  if(!drag) return;
  const edge=80; let v=0;
  if(drag.y>innerHeight-edge) v=Math.min(14,(drag.y-(innerHeight-edge))/4);
  else if(drag.y<edge) v=-Math.min(14,(edge-drag.y)/4);
  if(v){ const before=scrollY; scrollBy(0,v); drag.scroll+=scrollY-before; dragUpdate(); }
  requestAnimationFrame(dragScroll);
}
function endDrag(){
  if(!drag) return;
  const {rows,from,to}=drag; drag=null;
  rows.forEach(r=>{ r.style.transform=''; r.classList.remove('shift','drag'); });
  if(to!==from){
    const p=pls.find(x=>x.id===openPl);
    if(p){ const id=p.ids.splice(from,1)[0]; p.ids.splice(to,0,id); call('movePlaylist',p.id,from,to); }
  }
  renderList();
}
$('list').addEventListener('pointerup',endDrag);
$('list').addEventListener('pointercancel',endDrag);

function openSheet(html){
  sheet.innerHTML='<div class="grab"></div>'+html;

/* Окно с полями ввода. fields: [{value, ph}] */
function openForm(title,fields,cb){
  openSheet('<h3>'+title+'</h3>'+fields.map((f,i)=>'<input class="field" id="ff'+i+'" maxlength="80" placeholder="'+esc(f.ph)+'" value="'+esc(f.value)+'">').join('')+
    '<div class="row2"><button class="btn ghost" data-x="no">Отмена</button><button class="btn" data-x="ok">Сохранить</button></div>');
  const inputs=fields.map((f,i)=>$('ff'+i)); setTimeout(()=>inputs[0].focus(),260);
  const done=()=>{ const v=inputs.map(x=>x.value.trim()); if(!v[0]) return inputs[0].focus(); closeSheet(); cb(v); };
  inputs.forEach(x=>x.onkeydown=e=>{ if(e.key==='Enter') done(); });
  sheetClick=e=>{ const b=e.target.closest('[data-x]'); if(b) b.dataset.x==='ok'?done():closeSheet(); };
}
const openName=(title,value,cb)=>openForm(title,[{value,ph:'Название'}],v=>cb(v[0]));

/* Меню трека: плейлист, свои названия и обложки */
function openTrackMenu(id){
  const t=libMap[id]; if(!t) return;
  const hasAlbum=t.albumId&&t.albumId!=='0';
  const opt=(k,label)=>'<button class="opt" data-k="'+k+'">'+label+'</button>';
  openSheet('<div class="tm"><span class="th"><img alt="" src="'+artUrl(id)+'" onerror="noArt(this)"></span>'+
    '<div><h3>'+esc(t.title)+'</h3><p class="muted">'+esc(t.artist)+(t.album?' · '+esc(t.album):'')+'</p></div></div><div class="opts">'+
    opt('add','Добавить в плейлист')+
    opt('rename','Переименовать трек')+
    opt('tcover','Своя обложка трека')+
    (hasAlbum?opt('album','Переименовать альбом')+opt('acover','Своя обложка альбома'):'')+
    (t.tc?opt('treset','Вернуть трек как было'):'')+
    (t.ac?opt('areset','Вернуть альбом как было'):'')+
    opt('hide','Скрыть из медиатеки')+
    '<button class="opt danger" data-k="del">Удалить с телефона</button>'+
  '</div>');
  sheetClick=e=>{
    const b=e.target.closest('[data-k]'); if(!b) return;
    const k=b.dataset.k;
    if(k==='add') return openAddTo(id);
    if(k==='rename') return openForm('Переименовать трек',[{value:t.title,ph:'Название'},{value:t.artist,ph:'Исполнитель'}],v=>{ call('editTrack',id,v[0],v[1]||t.artist); speak(lines.renamed); });
    if(k==='del') return openDelete(id);
    if(k==='album') return openForm('Переименовать альбом',[{value:t.album,ph:'Название альбома'}],v=>{ call('editAlbum',t.albumId,v[0]); speak(lines.renamed); });
    closeSheet();
    if(k==='tcover'){ call('pickCover','t',id); speak(lines.coverPick); }
    if(k==='acover'){ call('pickCover','a',t.albumId); speak(lines.coverPick); }
    if(k==='treset'){ call('resetCustom','t',id); speak(lines.reset); }
    if(k==='areset'){ call('resetCustom','a',t.albumId); speak(lines.reset); }
    if(k==='hide'){ call('hideTrack',id); speak(lines.hid); }
  };
}

  openSheet('<h3>Удалить с телефона?</h3><p class="muted">«'+esc(t.title)+'» пропадёт насовсем: и файл, и трек во всех плейлистах. '+

function openAddTo(trackId){
  const t=libMap[trackId]; if(!t) return;
  openSheet('<h3>Добавить в плейлист</h3><p class="muted">'+esc(t.title)+'</p><div class="opts">'+
    pls.map(p=>'<button class="opt" data-pl="'+esc(p.id)+'">'+esc(p.name)+(p.ids.includes(trackId)?'<div class="muted">уже там</div>':'')+'</button>').join('')+
    '<button class="opt accent" data-new="1">+ Новый плейлист</button></div>');
  sheetClick=e=>{
    const b=e.target.closest('[data-pl],[data-new]'); if(!b) return;
    if(b.dataset.pl){
      const p=pls.find(x=>x.id===b.dataset.pl); if(!p) return;
      closeSheet();
      if(!p.ids.includes(trackId)){ call('addToPlaylist',p.id,trackId); speak(lines.plAdd(esc(t.title),esc(p.name))); }
    } else {
      openName('Новый плейлист','',n=>{ const id=call('newPlaylist',n); call('addToPlaylist',id,trackId); speak(lines.plAdd(esc(t.title),esc(n))); });
    }
  };
}

function setEq(k){ eqStyle=k; store.set('eq',k); speak(lines.viz[k]); }

function openTheme(){
  const bgThumb={dawn:'background-image:radial-gradient(circle at 50% 78%,#ffc070 0 16%,transparent 17%),linear-gradient(#2a1c4f,#b04f7a 70%,#1f1540 70%)',
    sil:'background-image:url(sil.webp);background-color:#150c28',
    car:'background-image:url(car.jpg)',
    custom:bgName?'background-image:url('+HOST+'/custom/'+bgName+')':''};
  const eqThumb={classic:'',wave:'background-image:url(th-wave.png)',hud:'background-image:url(th-hud.png)'};
  const bgCards=BGS.map(([k,name])=>{
    const empty=k==='custom'&&!bgName;
    return '<button class="thc'+(bg===k?' on':'')+(empty?' none':'')+'" data-bg="'+k+'"><i style="'+bgThumb[k]+'">'+(empty?PLUS:'')+'</i><span>'+name+'</span></button>';
  }).join('');
  const eqCards=EQS.map(([k,name])=>
    '<button class="thc'+(eqStyle===k?' on':'')+(k==='classic'?' eqc':'')+'" data-eq="'+k+'"><i style="'+eqThumb[k]+'"></i><span>'+name+'</span></button>'
  ).join('');
  const pals=Object.entries(PALETTES).map(([k,[n,a,b]])=>'<button class="chip'+(palette===k?' on':'')+'" data-pal="'+k+'"><span class="sw" style="background:linear-gradient(135deg,'+a+','+b+')"></span>'+n+'</button>').join('');
  openSheet('<h3>Оформление</h3>'+
    '<p class="muted" style="margin:0 0 8px">Фон</p><div class="themes">'+bgCards+'</div>'+
    '<p class="muted" style="margin:14px 0 8px">Эквалайзер — ложится поверх любого фона</p><div class="themes">'+eqCards+'</div>'+
    '<p class="muted" style="margin:14px 0 8px">Цвет полос</p><div class="chips">'+pals+'</div>'+
    (bgName?'<button class="btn ghost full" data-bgpick="1">Выбрать другое фото</button>':''));
  sheet.dataset.kind='theme';
  sheetClick=e=>{
    const tb=e.target.closest('[data-bg]'), te=e.target.closest('[data-eq]'), p=e.target.closest('[data-pal]');
    if(e.target.closest('[data-bgpick]')){ call('pickBackground'); speak(lines.bgPick); return; }
    if(tb){
      const k=tb.dataset.bg;
      if(k==='custom'&&!bgName){ call('pickBackground'); speak(lines.bgPick); return; }
      setBg(k); openTheme();
    }
    if(te){ setEq(te.dataset.eq); openTheme(); }
    if(p){ palette=p.dataset.pal; store.set('palette',palette); speak(lines.palette); openTheme(); }
  };
}

function openSleep(){
  const status= st.sleep>0?'Усну через '+Math.ceil(st.sleep/60000)+' мин.'
    : st.sleep===-1?'Усну после этого трека.'
    : 'Выключу музыку, когда скажешь. Последние полминуты буду плавно затихать.';
  openSheet('<h3>Таймер сна</h3><p class="muted">'+status+'</p><div class="grid">'+
    [15,30,45,60,90,120].map(m=>'<button class="chip" data-m="'+m+'">'+m+' мин</button>').join('')+
    '<button class="chip wide" data-m="-1">До конца трека</button></div>'+
    (st.sleep?'<button class="btn ghost full" data-m="0">Выключить таймер</button>':''));
  sheetClick=e=>{
    const b=e.target.closest('[data-m]'); if(!b) return;
    const m=+b.dataset.m; call('sleep',m); closeSheet();
    speak(m>0?lines.sleepSet(m):m===-1?lines.sleepTrack:lines.sleepOff);
  };
}
$('bSleep').onclick=openSleep;

function openEq(){
  let s; try{ s=JSON.parse(call('eqState')||'{}'); }catch(e){ s={}; }
  if(!s.ok&&!s.bassOk){ openSheet('<h3>Эквалайзер</h3><p class="muted">На этом телефоне эквалайзер недоступен. Попробуй включить любой трек и открыть снова.</p>'); return; }
  const hz=f=>f>=1000?(f/1000).toFixed(f%1000?1:0).replace('.',',')+' кГц':f+' Гц';
  const db=l=>{ const v=Math.round(l/100); return (v>0?'+':'')+v+' дБ'; };
  let h='<h3>Эквалайзер</h3>';
  if(s.ok){
    h+='<div class="chips">'+(s.presets||[]).map((n,i)=>'<button class="chip'+(s.preset===i?' on':'')+'" data-p="'+i+'">'+esc(RU_PRESETS[String(n).replace(/\u0000/g,'').trim()]||n)+'</button>').join('')+'</div>';
    h+=(s.bands||[]).map((b,i)=>'<label class="band"><span>'+hz(b.hz)+'</span><input type="range" min="'+s.min+'" max="'+s.max+'" step="50" value="'+b.level+'" data-b="'+i+'"><span class="v" id="bv'+i+'">'+db(b.level)+'</span></label>').join('');
  }
  if(s.bassOk) h+='<label class="band"><span>Басы</span><input type="range" min="0" max="1000" step="10" value="'+s.bass+'" id="bassIn"><span class="v" id="bassV">'+Math.round(s.bass/10)+'%</span></label>';
  h+='<button class="btn ghost full" data-reset="1">Сбросить</button>';
  openSheet(h);
  sheet.querySelectorAll('input[type=range]').forEach(prog);
  sheet.oninput=e=>{
    const r=e.target; prog(r);
    if(r.dataset.b!==undefined) $('bv'+r.dataset.b).textContent=db(+r.value);
    if(r.id==='bassIn') $('bassV').textContent=Math.round(r.value/10)+'%';
  };
  sheet.onchange=e=>{
    const r=e.target;
    if(r.dataset.b!==undefined){ call('eqBand',+r.dataset.b,+r.value); sheet.querySelectorAll('.chip.on').forEach(c=>c.classList.remove('on')); }
    if(r.id==='bassIn') call('eqBass',+r.value);
  };
  sheetClick=e=>{
    const p=e.target.closest('[data-p]');
    if(p){ call('eqPreset',+p.dataset.p); speak(lines.eq(esc(p.textContent))); setTimeout(openEq,150); return; }
    if(e.target.closest('[data-reset]')){ call('eqReset'); speak(lines.eqReset); setTimeout(openEq,150); }
  };
}
$('bEq').onclick=openEq;

/* ===== Аврора крупно ===== */
let artOpen=false;
$('ava').onclick=()=>{ $('artSay').textContent=pick(lines.art); $('art').classList.add('show'); artOpen=true; };
function closeArt(){ $('art').classList.remove('show'); artOpen=false; }
$('art').onclick=closeArt;

/* ===== Кнопки плеера ===== */
if(!A) speak('Это экран Android-приложения, в браузере кнопки не работают.');
$('play').onclick=()=>{ if(!st.currentId&&!lib.length){ speak(perm===false?lines.perm:'Сначала выбери трек в списке.'); return; } call('toggle'); };
$('next').onclick=()=>call('next');
$('prev').onclick=()=>call('prev');
/* Перемешать: сразу включаем случайный трек */
$('shuffle').onclick=()=>{
  if(st.shuffle){ call('setShuffle',false); speak(lines.shuffleOff); return; }
  // всегда мешаем всю библиотеку, а не то, что случайно осталось в текущей (возможно короткой) очереди —
  // иначе кнопка «застревала» на нескольких треках, если до этого играл маленький плейлист
  if(lib.length){ call('setShuffle',true); call('playList',JSON.stringify(lib.map(t=>t.id)),Math.floor(Math.random()*lib.length),'lib'); }
  else return speak(perm===false?lines.perm:lines.recsEmpty);
  speak(lines.shuffleGo);
};
$('repeat').onclick=()=>{ const m=st.repeat==='off'?'all':st.repeat==='all'?'one':'off'; call('setRepeat',m); speak(lines.repeat[m]); };
const pos=$('pos');
pos.addEventListener('input',()=>{ seeking=true; prog(pos); $('cur').textContent=fmt(pos.value/1000*st.dur); });
pos.addEventListener('change',()=>{ const ms=pos.value/1000*st.dur; call('seek',ms); st.pos=ms; stAt=performance.now(); seeking=false; });

/* ===== Небо: солнце поднимается, пока играет трек ===== */
const cv=$('sky'), g=cv.getContext('2d'), ava=$('ava');
let W=0,H=0;
function size(){ const d=Math.min(devicePixelRatio||1,2); W=cv.clientWidth; H=cv.clientHeight; cv.width=W*d; cv.height=H*d; g.setTransform(d,0,0,d,0,0); }
new ResizeObserver(size).observe(cv); size();
const stars=Array.from({length:46},()=>({x:Math.random(),y:Math.random()*.62,r:Math.random()*1.3+.3,ph:Math.random()*6.28}));
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mix=(a,b,t)=>{a=hex(a);b=hex(b);return 'rgb('+a.map((v,i)=>Math.round(v+(b[i]-v)*t)).join(',')+')'};
const N=22, lv=new Array(N).fill(0);
let lift=0, bassS=0, frame=0;

/* ===== Режим «Тишина»: если музыка стоит и телефон не трогали N секунд ===== */
const IDLE_AFTER_MS=25000;
const idleEl=$('idleScreen');
let lastTouch=Date.now(), idleOn=false;
function setIdle(on){
  if(idleOn===on) return;
  idleOn=on;
  idleEl.classList.toggle('on',on);
}
['pointerdown','touchstart','mousedown','keydown'].forEach(ev=>
  document.addEventListener(ev,()=>{ lastTouch=Date.now(); setIdle(false); },{passive:true})
);
setInterval(()=>{
  if(!st.playing && Date.now()-lastTouch>IDLE_AFTER_MS) setIdle(true);
},1000);

/* ===== Глитчи «помех»: если трек по спектру похож на белый шум, экран изредка сбоит ===== */
// «Плоскостность» спектра (geometric mean / arithmetic mean): у шума все полосы примерно
// равны — плоскостность близка к 1; у музыки есть выраженные пики — заметно ниже.
let flatHist=[], noiseMode=false, glitchOn=false, glitchNext=0;
function updateNoise(){
  let logSum=0,sum=0,n=0;
  for(let i=2;i<lv.length;i++){ const v=Math.max(lv[i],1e-4); logSum+=Math.log(v); sum+=v; n++; }
  const amean=sum/n, flat=amean>0.03?Math.exp(logSum/n)/amean:0;
  flatHist.push(flat); if(flatHist.length>90) flatHist.shift();
  const avgFlat=flatHist.reduce((a,b)=>a+b,0)/flatHist.length;
  noiseMode = st.playing && flatHist.length>30 && avgFlat>0.72;
}
function tickGlitch(t){
  if(!noiseMode){ glitchOn=false; ava.style.opacity=''; return; }
  if(t>glitchNext){
    glitchOn = Math.random()<0.45;                              // сбои волнами, не постоянно
    glitchNext = t + (glitchOn ? 0.15+Math.random()*0.35 : 1.2+Math.random()*2.4);
  }
  ava.style.opacity = glitchOn ? (Math.random()<0.5 ? (0.35+Math.random()*0.4).toFixed(2) : '') : '';
}
// маленькая заготовка «цифрового шума», перегенерируется на каждую вспышку
let noiseTile=document.createElement('canvas'); noiseTile.width=noiseTile.height=96;
const ntx=noiseTile.getContext('2d');
function rollNoiseTile(){
  const id=ntx.createImageData(96,96), d=id.data;
  for(let i=0;i<d.length;i+=4){ const v=Math.random()*255|0; d[i]=d[i+1]=d[i+2]=v; d[i+3]=255; }
  ntx.putImageData(id,0,0);
}
function drawGlitch(){
  // горизонтальные полосы со сдвигом и лёгкой цветной каёмкой (красный канал сдвинут отдельно)
  const bands=3+Math.floor(Math.random()*4);
  for(let b=0;b<bands;b++){
    const h=3+Math.random()*14, y=Math.random()*Math.max(1,H-h), dx=(Math.random()-.5)*(26+Math.random()*30);
    try{
      const hh=Math.min(h,H-y);
      const slice=g.getImageData(0,y,W,hh), d=slice.data, shift=2+Math.floor(Math.random()*4);
      for(let py=0; py<hh; py++) for(let px=W-1; px>=shift; px--){
        const i=(py*W+px)*4, ir=(py*W+px-shift)*4; d[i]=d[ir];
      }
      g.putImageData(slice,dx,y);
    }catch(e){}
  }
  // мерцающий цифровой шум поверх
  if(Math.random()<0.5) rollNoiseTile();
  g.save(); g.globalAlpha=0.07+Math.random()*0.06; g.imageSmoothingEnabled=false;
  g.drawImage(noiseTile,0,0,W,H);
  g.restore();
}

function draw(ts){
  frame++;
  const p0=st.dur>0?curPos()/st.dur:0;
  if(!seeking){ pos.value=p0*1000; prog(pos); $('cur').textContent=fmt(curPos()); }
  lift+=(p0-lift)*.05;
  const p=lift, hy=H*.7, cx=W/2, t=ts/1000;

  if(st.moving&&A&&frame%2===0){
    const s=A.levels();
    if(s){ const a=s.split(','); for(let k=0;k<N;k++) lv[k]=+a[k]||0; }
  } else if(!st.moving){ for(let k=0;k<N;k++) lv[k]*=.9; }
  bassS+=((lv[0]+lv[1]+lv[2])/3-bassS)*.25;

  // Аврора покачивается в такт
  const k=bassS;
  ava.style.transform='scale('+(1+k*.09).toFixed(3)+') rotate('+(Math.sin(t*2.2)*k*5).toFixed(2)+'deg)';
  ava.style.boxShadow='0 0 0 3px var(--bg), 0 0 '+(6+k*26).toFixed(1)+'px '+(k*5).toFixed(1)+'px rgba(255,122,138,'+(.25+k*.6).toFixed(2)+')';

  // 1) фон — 2) эквалайзер поверх — 3) силуэт Авроры (у него прозрачный фон, поэтому рисуется последним
  const bgFn={dawn:drawBgDawn,sil:drawBgSil,car:()=>drawBgPhoto(IMG.car),custom:()=>drawBgPhoto(IMG.custom)}[bg]||drawBgDawn;
  bgFn(p,hy,cx,t);
  ({classic:eqClassic,wave:eqWave,hud:eqHud}[eqStyle]||eqClassic)(p,hy,cx,t);
  if(bg==='sil') drawCover(IMG.sil);

  updateNoise(); tickGlitch(t);
  if(glitchOn) drawGlitch();

  requestAnimationFrame(draw);
}
/* ===== Фоны: рисуют только задник, без полос эквалайзера ===== */
function drawBgDawn(p,hy,cx,t){
  const sky=g.createLinearGradient(0,0,0,hy);
  sky.addColorStop(0,mix('#120d2a','#3b2a6b',p));
  sky.addColorStop(.6,mix('#2a1c4f','#b04f7a',p));
  sky.addColorStop(1,mix('#4a2a5e','#ffab6e',p));
  g.fillStyle=sky; g.fillRect(0,0,W,hy+1);

  for(const s of stars){
    const a=(1-p*1.1)*(.55+.45*Math.sin(t*1.3+s.ph)); if(a<=0) continue;
    g.globalAlpha=a; g.fillStyle='#f3e6ff'; g.beginPath(); g.arc(s.x*W,s.y*H,s.r,0,6.283); g.fill();
  }
  g.globalAlpha=1;

  const R=Math.min(W,H)*.16*(1+bassS*.18);
  const sy=hy+R*.55-p*(hy*.48);
  const glow=g.createRadialGradient(cx,sy,R*.4,cx,sy,R*3.2);
  glow.addColorStop(0,'rgba(255,170,110,'+(.45+bassS*.35)+')'); glow.addColorStop(1,'rgba(255,120,140,0)');
  g.fillStyle=glow; g.fillRect(0,0,W,hy);
  const sun=g.createLinearGradient(0,sy-R,0,sy+R);
  sun.addColorStop(0,'#ffd08a'); sun.addColorStop(1,'#ff7a6a');
  g.fillStyle=sun; g.beginPath(); g.arc(cx,sy,R,0,6.283);
  const ex=R*.62, ew=R*.36, eh=R*.62+bassS*R*.25;
  g.moveTo(cx-ex-ew*.55,sy-R*.72); g.lineTo(cx-ex+ew*.1,sy-R-eh); g.lineTo(cx-ex+ew*.95,sy-R*.92); g.closePath();
  g.moveTo(cx+ex+ew*.55,sy-R*.72); g.lineTo(cx+ex-ew*.1,sy-R-eh); g.lineTo(cx+ex-ew*.95,sy-R*.92); g.closePath();
  g.fill();

  const ground=g.createLinearGradient(0,hy,0,H);
  ground.addColorStop(0,mix('#1f1540','#3a2352',p)); ground.addColorStop(1,'#120d26');
  g.fillStyle=ground; g.fillRect(0,hy,W,H-hy);
  g.fillStyle='rgba(255,190,130,'+(.25+p*.4)+')';
  for(let j=0;j<5;j++){ const w=R*(1.6-j*.26)*(1+p); g.fillRect(cx-w/2,hy+6+j*7,w,2); }
  g.fillStyle='rgba(255,200,150,'+(.35+p*.4)+')'; g.fillRect(0,hy,W,1);
}
function drawBgSil(){
  const bg=g.createLinearGradient(0,0,0,H); bg.addColorStop(0,'#0b0716'); bg.addColorStop(1,'#1a0d2e');
  g.fillStyle=bg; g.fillRect(0,0,W,H);
  const gl=g.createRadialGradient(W*.49,H*.5,0,W*.49,H*.5,H*.75);
  gl.addColorStop(0,'rgba(190,90,230,'+(.16+bassS*.45).toFixed(3)+')'); gl.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gl; g.fillRect(0,0,W,H);
}
function drawBgPhoto(img){
  if(!drawCover(img)){
    g.fillStyle='#120a22'; g.fillRect(0,0,W,H);
    g.fillStyle='#b4a3d6'; g.font='15px Manrope, sans-serif'; g.textAlign='center';
    g.fillText('Выбери фото в «Оформлении»',W/2,H/2);
  }
  const sh=g.createLinearGradient(0,H*.4,0,H);
  sh.addColorStop(0,'rgba(10,6,20,0)'); sh.addColorStop(1,'rgba(10,6,20,'+(.7-bassS*.2).toFixed(3)+')');
  g.fillStyle=sh; g.fillRect(0,0,W,H);
}
/* Картинка на весь холст с обрезкой краёв, как background-size:cover */
function drawCover(img){
  const iw=img.naturalWidth, ih=img.naturalHeight; if(!iw||!img.complete) return false;
  const s=Math.max(W/iw,H/ih), w=iw*s, h=ih*s;
  g.drawImage(img,(W-w)/2,(H-h)/2,w,h); return true;
}
/* Полосы: два прохода, широкий полупрозрачный даёт свечение */
function bars(fill,cx,base,maxH,mirror,minH){
  const step=(W*.94/2)/N, bw=Math.max(2,step*.44);
  for(let pass=0;pass<2;pass++){
    g.globalAlpha=pass?0.95:0.22; g.fillStyle=fill;
    const w=pass?bw:bw*2.4;
    for(let k=0;k<N;k++){
      const h=Math.max(minH,lv[k]*maxH);
      for(const sg of [-1,1]){
        const x=cx+sg*(k+.5)*step-w/2;
        if(mirror) g.fillRect(x,base-h,w,h*2); else g.fillRect(x,base-h,w,h);
      }
    }
  }
  g.globalAlpha=1;
}
/* ===== Эквалайзеры: рисуются поверх уже готового фона, каким бы он ни был ===== */
/* Классика: у «Рассвета» полосы поднимаются из-за горизонта тёплым цветом,
   на любом другом фоне — снизу вверх, в выбранном цвете палитры. */
function eqClassic(p,hy,cx,t){
  if(bg==='dawn'){
    const step=(W*.94/2)/N, bw=Math.max(2,step*.46);
    const bar=g.createLinearGradient(0,hy,0,hy-hy*.6);
    bar.addColorStop(0,'rgba(255,190,120,.95)'); bar.addColorStop(1,'rgba(255,110,150,0)');
    g.fillStyle=bar;
    for(let i=0;i<N;i++){ const h=Math.max(1.5,lv[i]*hy*.58);
      for(const sg of [-1,1]) g.fillRect(cx+sg*(i+.5)*step-bw/2,hy-h,bw,h); }
    g.fillStyle='rgba(255,160,120,.22)';
    for(let i=0;i<N;i++){ const h=lv[i]*hy*.2; for(const sg of [-1,1]) g.fillRect(cx+sg*(i+.5)*step-bw/2,hy+2,bw,h); }
    return;
  }
  const [,a,b]=PALETTES[palette]||PALETTES.neon;
  const vg=g.createLinearGradient(0,H,0,H*.5); vg.addColorStop(0,a); vg.addColorStop(1,b);
  bars(vg,W/2,H-4,H*.36,false,2);
}
/* Волна: точечные пики над горизонтом и отражение из штрихов */
function eqWave(){
  const M=64, my=H*.58, gap=W/(M+6), dot=Math.max(1.2,gap*.3), x0=(W-gap*(M-1))/2;
  g.fillStyle='#f4f2ff';
  for(let i=0;i<M;i++){
    const c=Math.abs(i-(M-1)/2)/((M-1)/2), f=c*(N-1), k=Math.floor(f), fr=f-k;
    let v=lv[k]*(1-fr)+lv[Math.min(N-1,k+1)]*fr;
    v*=0.72+0.28*Math.sin(i*12.9898);                 // неровность, как у живого звука
    const h=Math.max(2,v*H*.52), x=x0+i*gap;
    for(let y=0;y<h;y+=3){ g.globalAlpha=0.3+0.7*(1-y/h); g.fillRect(x-dot/2,my-y-dot,dot,dot); }
    const rh=h*.55;
    for(let y=5;y<rh;y+=5){ g.globalAlpha=0.85*(1-y/rh); g.fillRect(x-gap/2+.5,my+y,gap-1,1.3); }
  }
  g.globalAlpha=.55; g.fillRect(0,my,W,1); g.globalAlpha=1;
}
/* HUD: кольца с делениями, радиальный спектр, прицел и дуга прогресса */
function eqHud(p,hy,cx0,t){
  g.fillStyle='rgba(10,4,10,.28)';
  for(let x=20;x<W;x+=40) for(let y=20;y<H;y+=40){ g.fillRect(x-3,y,7,1); g.fillRect(x,y-3,1,7); }
  const cx=W/2, cy=H/2, R=Math.min(W,H)*.27, [,acc]=PALETTES[palette]||PALETTES.neon, L='rgba(236,236,255,.85)';
  g.strokeStyle=L; g.lineWidth=1;
  const rot=t*.15;
  g.beginPath();
  for(let i=0;i<120;i++){
    const a=rot+i*Math.PI/60, r1=R*1.42, r2=r1+(i%10?4:9);
    g.moveTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1); g.lineTo(cx+Math.cos(a)*r2,cy+Math.sin(a)*r2);
  }
  g.stroke();
  g.lineWidth=3;
  for(let q=0;q<4;q++){ const s0=-t*.3+q*Math.PI/2; g.beginPath(); g.arc(cx,cy,R*1.62,s0,s0+.45); g.stroke(); }
  const p0=st.dur>0?curPos()/st.dur:0;
  g.lineWidth=2; g.strokeStyle='rgba(236,236,255,.16)'; g.beginPath(); g.arc(cx,cy,R*1.25,0,Math.PI*2); g.stroke();
  if(p0>0){ g.strokeStyle=acc; g.beginPath(); g.arc(cx,cy,R*1.25,-Math.PI/2,-Math.PI/2+p0*Math.PI*2); g.stroke(); }
  g.strokeStyle=L; g.lineWidth=2; g.beginPath();
  const M=72;
  for(let i=0;i<M;i++){
    const a=-Math.PI/2+i*Math.PI*2/M, fr=(i<=M/2?i:M-i)/(M/2), v=lv[Math.min(N-1,Math.floor(fr*(N-1)))];
    const r1=R*.98, r2=r1-2-v*R*.5;                   // полосы смотрят внутрь, к прицелу
    g.moveTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1); g.lineTo(cx+Math.cos(a)*r2,cy+Math.sin(a)*r2);
  }
  g.stroke();
  g.lineWidth=1;
  g.beginPath(); g.arc(cx,cy,R*.3*(1+bassS*.3),0,Math.PI*2); g.stroke();
  g.beginPath(); g.arc(cx,cy,R*.12,0,Math.PI*2); g.stroke();
  g.beginPath();
  g.moveTo(cx-R*.95,cy); g.lineTo(cx-R*.4,cy); g.moveTo(cx+R*.4,cy); g.lineTo(cx+R*.95,cy);
  g.moveTo(cx,cy-R*.95); g.lineTo(cx,cy-R*.4); g.moveTo(cx,cy+R*.4); g.lineTo(cx,cy+R*.95);
  g.stroke();
  g.fillStyle='rgba(236,236,255,.7)'; g.font='10px ui-monospace,"Roboto Mono",monospace';
  g.textAlign='left'; g.fillText('FLUORITE_BLUE // AURORA',14,20); g.fillText('SIGNAL '+(st.moving?'LOCKED':'STANDBY'),14,H-12);
  g.textAlign='right'; g.fillText(st.dur>0?fmt(curPos()):'LIVE',W-14,20); g.fillText('BASS '+String(Math.round(bassS*100)).padStart(3,'0'),W-14,H-12);
}

requestAnimationFrame(draw);

$('uname').textContent=USER_NAME;
updateNow(); renderList();
if(A) A.ready();
})();
</script>
